[package]
name = "kv-dl-server"
version = "1.1.4"
edition = "2021"
description = "KV-DL API server - metube-style YouTube downloader backend"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
hmac = "0.12"
sha2 = "0.10"
url = "2"
form_urlencoded = "1"
percent-encoding = "2"
bytes = "1"

[profile.release]
opt-level = 2
strip = true
